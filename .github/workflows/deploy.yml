name: Sync App Spec and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_URL: https://connected-in-climate-n42zu.ondigitalocean.app

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject secrets into app spec
        run: |
          for key in CLERK_SECRET_KEY RESEND_API_KEY OPENAI_API_KEY GOOGLE_SERVICE_ACCOUNT_KEY; do
            yq -i "(.services[0].envs[] | select(.key == \"$key\")).value = strenv($key)" .do/app.yaml
          done
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          print_build_logs: true

      - name: Wait for app to stabilize
        run: sleep 15

      - name: Smoke test — health check
        run: |
          status=$(curl -sf "$APP_URL/api/health" | jq -r '.ok')
          if [ "$status" != "true" ]; then
            echo "Health check failed"
            exit 1
          fi
          echo "Health check passed"

      - name: Smoke test — frontend loads
        run: |
          status=$(curl -sf -o /dev/null -w '%{http_code}' "$APP_URL/")
          if [ "$status" != "200" ]; then
            echo "Frontend failed to load (HTTP $status)"
            exit 1
          fi
          echo "Frontend loaded OK"
