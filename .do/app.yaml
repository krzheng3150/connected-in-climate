# App spec for DigitalOcean App Platform.
# Migration guide: docs/migration.md
# Lines marked [INSTANCE-SPECIFIC] must change when moving to a new DO account.
name: connected-in-climate
region: tor # [INSTANCE-SPECIFIC] change to preferred region
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
services:
  - name: connected-in-climate
    environment_slug: node-js
    github:
      repo: krzheng3150/connected-in-climate # [INSTANCE-SPECIFIC] new owner/repo
      branch: main
      deploy_on_push: true
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dev-db-900747.DATABASE_URL} # [INSTANCE-SPECIFIC] matches databases[0].name
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: krzheng3150@gmail.com,cohenca3@gmail.com,info@connectedinclimate.com # [INSTANCE-SPECIFIC] new admin emails
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET # set in DO console
      - key: GOOGLE_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET # set in DO console
      - key: SEND_EMAIL
        scope: RUN_TIME
        value: "1"
      - key: CLERK_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: pk_test_aGVscGZ1bC1saW9uLTk1MzYuY2xlcmsuYWNjb3VudHMuZGV2JA # [INSTANCE-SPECIFIC] public key from Clerk dashboard
      - key: VITE_CLERK_PUBLISHABLE_KEY
        scope: RUN_AND_BUILD_TIME
        value: pk_test_aGVscGZ1bC1saW9uLTk1MzYuY2xlcmsuYWNjb3VudHMuZGV2JA # [INSTANCE-SPECIFIC] same as above, for Vite frontend build
      - key: CLERK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET # set in DO console — from Clerk dashboard
databases:
  - name: dev-db-900747 # [INSTANCE-SPECIFIC] DO auto-generates this name
    engine: PG
    version: "17"
