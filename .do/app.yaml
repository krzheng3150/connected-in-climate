name: connected-in-climate
region: tor
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
services:
  - name: connected-in-climate
    environment_slug: node-js
    github:
      repo: krzheng3150/connected-in-climate
      branch: main
      deploy_on_push: true
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dev-db-900747.DATABASE_URL}
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: krzheng3150@gmail.com,cohenca3@gmail.com
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        scope: RUN_TIME
        value: connected-in-climate-sheets@i-see-493001.iam.gserviceaccount.com
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
databases:
  - name: dev-db-900747
    engine: PG
    version: "17"
